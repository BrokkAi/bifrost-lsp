[package]
name = "brokk-bifrost-lsp"
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
description = "Standalone Bifrost language server"
license = "Apache-2.0"
repository = "https://github.com/BrokkAi/bifrost-lsp"
readme = "README.md"
exclude = [".agents/**", "editors/**", "tests/**"]
default-run = "bifrost-lsp"

[lib]
name = "brokk_bifrost_lsp"

[[bin]]
name = "bifrost-lsp"
path = "src/bin/bifrost-lsp.rs"

[dependencies]
brokk-bifrost = "=0.13.0"
brokk-bifrost-analysis = "=0.13.0"
brokk-bifrost-flow = "=0.13.0"
brokk-bifrost-policy = "=0.13.0"
brokk-bifrost-rql = "=0.13.0"
brokk-bifrost-runtime = "=0.13.0"
crossbeam-channel = "0.5"
glob = "0.3.3"
lsp-server = "0.7"
lsp-types = "0.97"
regex = "1.12.2"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tree-sitter = "0.25.10"
tree-sitter-python = "0.25.0"
toml = "0.8.23"

[dev-dependencies]
brokk-bifrost-semantic-packs = "=0.13.0"
proptest = "1.11"
tempfile = "3.23.0"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[profile.dev]
debug = "line-tables-only"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(scheduled_tests)"] }
