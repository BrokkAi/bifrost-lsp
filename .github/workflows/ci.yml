name: CI
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  rust-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAVA_HOME: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --check
  rust-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      JAVA_HOME: ""
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: cargo check --locked --all-targets
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
  release-helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: node --test scripts/server-release.test.mjs scripts/prepare-vscode-extension-manifest.test.mjs
  vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode
      - run: npx --no-install vsce package --out ../../bifrost-vscode-ci.vsix
        working-directory: editors/vscode
      - run: unzip -tq bifrost-vscode-ci.vsix && unzip -Z1 bifrost-vscode-ci.vsix | grep -Fx extension/LICENSE.md && unzip -Z1 bifrost-vscode-ci.vsix | grep -Fx extension/THIRD_PARTY_LICENSES.txt
