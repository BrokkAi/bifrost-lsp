name: Server qualification
on:
  workflow_dispatch:
    inputs:
      engine_commit:
        description: Reviewed public BrokkAi/bifrost engine commit (full 40-character SHA)
        required: true
        type: string
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: ""
      BIFROST_PARALLELISM: "1"
      RAYON_NUM_THREADS: "1"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require immutable engine revision
        env:
          ENGINE_COMMIT: ${{ inputs.engine_commit }}
        run: '[[ "$ENGINE_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: BrokkAi/bifrost
          ref: ${{ inputs.engine_commit }}
          path: .engine
          persist-credentials: false
      - name: Configure exact public engine checkout
        env:
          ENGINE_COMMIT: ${{ inputs.engine_commit }}
        run: python3 scripts/configure-local-engine.py .engine --expected-revision "$ENGINE_COMMIT"
      - run: cargo fmt --check
      # Path overrides change package provenance in the registry lockfile.
      # Resolve once, then lock every subsequent gate to that exact graph.
      - run: cargo --config .cargo/local-engine.toml check --all-targets
      - run: cargo --config .cargo/local-engine.toml test --locked
      - run: cargo clippy --config .cargo/local-engine.toml --locked --all-targets -- -D warnings
      - run: cargo --config .cargo/local-engine.toml build --locked --release --bin bifrost-lsp
      - name: Package qualification artifact and evidence
        run: |
          mkdir -p dist
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          archive="bifrost-lsp-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          tar -czf "dist/$archive" -C target/release bifrost-lsp
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          target/release/bifrost-lsp pack-engine-profile > dist/engine-profile.json
          git rev-parse HEAD > dist/server-commit.txt
          git -C .engine rev-parse HEAD > dist/engine-commit.txt
          cp Cargo.lock dist/Cargo.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bifrost-lsp-linux-qualification
          path: dist/
          if-no-files-found: error
