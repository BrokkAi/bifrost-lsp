name: Post-release extension smoke
on:
  workflow_dispatch:
    inputs:
      version: { required: true, type: string }
permissions:
  contents: read
jobs:
  marketplaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - run: scripts/smoke-vscode-marketplaces.sh "${{ inputs.version }}"
