[profile.default]
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.default.junit]
path = "junit.xml"

# This test has a five-second bound against a formatter that sleeps ten
# seconds. Retain the source repository's scheduler reservation.
[[profile.default.overrides]]
filter = 'test(bifrost_lsp_server_formatting_shutdown_cancels_active_formatter)'
threads-required = "num-cpus"
